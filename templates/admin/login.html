<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · {{ site_name }} 管理后台</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/main.css">
<script>(function(){try{var t=localStorage.getItem('kz-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
</head>
<body class="login-body">
<div class="spine" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main class="login-box">
  <div class="login-brand">
    <svg class="brand-ico" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 3h20a2 2 0 0 1 2 2v17.6L21.6 29H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="currentColor" opacity=".22"/><path d="M6 3h20a2 2 0 0 1 2 2v17.6L21.6 29H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><rect x="8.5" y="7" width="15" height="9" fill="currentColor"/><path d="M9 24h2.5M13 24h2.5M17 24h2.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="butt"/></svg>
    <h1>{{ site_name }} · 管理后台</h1>
  </div>
  <form method="post" action="{{ base }}/login" class="login-form panel">
    <label class="field">
      <span class="field-name">账号</span>
      <input name="username" required autofocus autocomplete="username">
    </label>
    <label class="field">
      <span class="field-name">密码</span>
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary btn-block" type="submit">登录</button>
  </form>
  <p class="login-back"><a href="/">← 返回前台</a></p>
</main>
<div class="toast mono" id="toast" role="status" hidden></div>
<script src="/static/js/main.js" defer></script>
</body>
</html>
