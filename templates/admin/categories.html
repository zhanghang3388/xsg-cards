{% extends "admin/base.html" %}

{% block title %}分类管理{% endblock %}

{% block body %}
<header class="admin-head">
  <h1>分类管理</h1>
  <p class="admin-sub">排序值越大越靠前。</p>
</header>

<section class="panel">
  <h2 class="panel-sub">新增分类</h2>
  <form method="post" action="/admin/categories" class="inline-form">
    <input name="name" placeholder="分类名称" required maxlength="20">
    <input name="sort" type="number" value="0" class="w-s" title="排序">
    <button class="btn btn-primary" type="submit">添加</button>
  </form>
</section>

<section class="panel">
  <table class="tbl">
    <thead><tr><th class="w-s">ID</th><th>名称</th><th class="w-s">排序</th><th class="num">商品数</th><th class="w-actions">操作</th></tr></thead>
    <tbody>
      {% for c in cats %}
      <tr>
        <td class="mono">{{ c.id }}</td>
        <td><input form="cf{{ c.id }}" name="name" value="{{ c.name }}" maxlength="20" required></td>
        <td><input form="cf{{ c.id }}" name="sort" value="{{ c.sort }}" type="number" class="w-s"></td>
        <td class="num mono">{{ c.product_count }}</td>
        <td class="row-actions">
          <form id="cf{{ c.id }}" method="post" action="/admin/categories/{{ c.id }}"><button class="btn btn-s" type="submit">保存</button></form>
          <form method="post" action="/admin/categories/{{ c.id }}/delete" onsubmit="return confirm('确定删除分类「{{ c.name }}」？')"><button class="btn btn-s danger" type="submit">删除</button></form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
