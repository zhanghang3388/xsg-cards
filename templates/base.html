<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ site.theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name }} · 自动发卡{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/main.css">
<script>(function(){try{var t=localStorage.getItem('kz-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
</head>
<body>
<div class="spine" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header class="site-head">
  <div class="wrap head-in">
    <a class="brand" href="/" aria-label="{{ site.name }} 首页">
      <svg class="brand-ico" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 3h20a2 2 0 0 1 2 2v17.5L21.5 29H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-3z" fill="currentColor" opacity=".22"/><path d="M6 3h20a2 2 0 0 1 2 2v17.6L21.6 29H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><rect x="8.5" y="7" width="15" height="9" fill="currentColor"/><path d="M9 24h2.5M13 24h2.5M17 24h2.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="butt"/></svg>
      <span class="brand-name">{{ site.name }}</span>
      <span class="brand-mark">{{ site.mark }}</span>
      <span class="pwr" aria-hidden="true"></span>
    </a>
    <nav class="nav">
      <a href="/">首页</a>
      <a href="/query">订单查询</a>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="切换深浅主题" title="切换主题">
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9 19 19M19 5l-2.1 2.1M7.1 16.9 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </nav>
  </div>
</header>
<main class="wrap page-main">
{% block body %}{% endblock %}
</main>
<footer class="site-foot">
  <div class="wrap foot-in">
    <span class="mk">{{ site.mark }}</span>
    <span>{{ site.name }} · 全自动发卡</span>
    <span class="foot-links"><a href="/query">订单查询</a></span>
  </div>
</footer>
<div class="toast mono" id="toast" role="status" hidden></div>
<script src="/static/js/main.js" defer></script>
</body>
</html>
