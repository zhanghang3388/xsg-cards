[package]
name = "kazhan"
version = "0.1.0"
edition = "2021"
description = "潇洒哥的卡台 · 单商户自动发卡网"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
askama = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.15"
rand = "0.8"
chrono = "0.4"
md5 = "0.7"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
